name: Tests
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.201
      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      # The AppHost's `web` resource (Aspire.Hosting.JavaScript, added
      # unconditionally in AppHost.cs) is part of the distributed
      # application model the integration tests boot via
      # `DistributedApplicationTestingBuilder` + `AspireAppHostFixture`.
      # `dotnet test` therefore needs pnpm/Node on the runner too -- the
      # `web-installer` resource Aspire adds alongside `web` runs `pnpm
      # install` itself when the app starts.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: dotnet restore
      - name: Build project
        run: dotnet build --no-restore
      - name: Setup dev certificate
        run: |
          export SSL_CERT_DIR="$HOME/.aspnet/dev-certs/trust:$SSL_CERT_DIR"
          dotnet dev-certs https --trust
      - name: Run tests
        run: dotnet test --no-restore --verbosity normal

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Frontend/MovieDatabase.Web
    steps:
      - uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/Frontend/MovieDatabase.Web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
